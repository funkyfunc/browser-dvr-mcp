name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # The full adversarial gauntlet needs a real Chrome; CI runs the
      # Chrome-free unit suite (pure cores). The browser e2e tests run locally.
      - run: npm run test:unit
