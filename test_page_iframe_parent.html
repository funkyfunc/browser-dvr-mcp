<!DOCTYPE html>
<html>
<head>
  <title>Iframe Parent Test Page</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    iframe { border: 2px solid #ccc; width: 600px; height: 400px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Parent Document</h1>
  <button id="parent-btn">Parent Button</button>
  <div id="parent-status">Waiting...</div>

  <iframe id="test-iframe" src="test_iframe_child.html"></iframe>

  <script>
    document.getElementById('parent-btn').addEventListener('click', () => {
      document.getElementById('parent-status').innerText = 'Parent button clicked!';
    });
  </script>
</body>
</html>
