<!DOCTYPE html>
<html>
<head>
  <title>Browser Observability Test Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    #container {
      position: relative;
      width: 400px;
      height: 300px;
      border: 1px solid #ccc;
      padding: 10px;
    }
    #target-btn {
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }
    #occluded-btn {
      padding: 10px 20px;
      background: #28a745;
      color: white;
      border: none;
      cursor: pointer;
    }
    #overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    #input-field {
      margin-top: 15px;
      padding: 5px;
      width: 200px;
    }
  </style>
</head>
<body>
  <h1>Observability Test Arena</h1>
  
  <div id="container">
    <button id="target-btn">Clickable Button</button>
    <br><br>
    <input id="input-field" type="text" placeholder="Type here..." />
    <br><br>
    
    <div style="position: relative; height: 50px;">
      <button id="occluded-btn" style="position: absolute; top: 0; left: 0;">Occluded Button</button>
      <div id="overlay" style="position: absolute; top: 0; left: 0; width: 150px; height: 40px;">Modal Overlay (Blocked!)</div>
    </div>
  </div>

  <script>
    const btn = document.getElementById('target-btn');
    btn.addEventListener('click', () => {
      btn.textContent = 'Clicked!';
    });

    // Mock a React Fiber node on the button element for testing the sniffer
    btn.__reactFiber$mockFiberNode = {
      type: { name: 'SubmitButtonComponent' },
      memoizedState: { label: 'Clickable Button', active: true },
      memoizedProps: {},
      return: {
        type: { name: 'MainDashboardContainer' },
        memoizedState: { theme: 'light' },
        return: null
      }
    };
  </script>
</body>
</html>
